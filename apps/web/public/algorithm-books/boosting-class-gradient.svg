<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" rx="16" fill="#fffdf7"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#466559"/></marker></defs><g font-family="Arial,sans-serif" fill="#233a31"><text x="40" y="42" font-size="24" font-weight="bold">Binary log-loss: a correction signal for the score, not a direct probability increment</text><rect x="35" y="78" width="235" height="110" rx="12" fill="#e1eee4" stroke="#91a79a"/><text x="51" y="111" font-size="18">Current score</text><text x="51" y="153" font-size="22" font-weight="bold">F ≈ −2.197225</text><line x1="272" y1="133" x2="303" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="78" width="235" height="110" rx="12" fill="#fff0cf" stroke="#91a79a"/><text x="326" y="111" font-size="18">Sigmoid transform</text><text x="326" y="153" font-size="22" font-weight="bold">p = sigmoid(F)</text><line x1="547" y1="133" x2="578" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="78" width="235" height="110" rx="12" fill="#e9e3f5" stroke="#91a79a"/><text x="601" y="111" font-size="18">Current probability</text><text x="601" y="153" font-size="22" font-weight="bold">p = 0.1</text><line x1="822" y1="133" x2="853" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="78" width="235" height="110" rx="12" fill="#e0edf3" stroke="#91a79a"/><text x="876" y="111" font-size="18">True label y = 1</text><text x="876" y="153" font-size="22" font-weight="bold">y − p = +0.9</text><text x="40" y="232" font-size="19">The negative log-loss gradient with respect to F is y − p.</text><text x="40" y="266" font-size="19">Fit a correction tree to these signals, then add its scaled output to F.</text></g></svg>