<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" rx="16" fill="#fffdf7"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#466559"/></marker></defs><g font-family="Arial,sans-serif" fill="#233a31"><text x="40" y="42" font-size="24" font-weight="bold">One sigmoid neuron: trace the forward values, then multiply local sensitivities</text><rect x="35" y="78" width="235" height="110" rx="12" fill="#e1eee4" stroke="#91a79a"/><text x="51" y="111" font-size="18">Input and weight</text><text x="51" y="153" font-size="22" font-weight="bold">x = 2, w = 0.5</text><line x1="272" y1="133" x2="303" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="78" width="235" height="110" rx="12" fill="#fff0cf" stroke="#91a79a"/><text x="326" y="111" font-size="18">Score, bias b = 0</text><text x="326" y="153" font-size="22" font-weight="bold">z = wx + b = 1</text><line x1="547" y1="133" x2="578" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="78" width="235" height="110" rx="12" fill="#e9e3f5" stroke="#91a79a"/><text x="601" y="111" font-size="18">Sigmoid output</text><text x="601" y="153" font-size="22" font-weight="bold">a ≈ 0.731059</text><line x1="822" y1="133" x2="853" y2="133" stroke="#466559" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="78" width="235" height="110" rx="12" fill="#e0edf3" stroke="#91a79a"/><text x="876" y="111" font-size="18">Target y = 1</text><text x="876" y="153" font-size="22" font-weight="bold">L = ½(a−1)²</text><text x="40" y="232" font-size="19">Backward: dL/da ≈ −0.268941; da/dz ≈ 0.196612; dz/dw = 2.</text><text x="40" y="266" font-size="19">Multiply: dL/dw ≈ −0.105754. A small positive weight change lowers this loss locally.</text></g></svg>