name: Task 015.12 Independent Verification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: task-015-12-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_PUBLIC_BETA_FEEDBACK_FORM_URL: ""
  TASK01512_EVIDENCE: ${{ github.workspace }}/.task01512-evidence

jobs:
  frontend:
    name: Frontend tests, typecheck and production build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
      - name: Record runner identity
        run: |
          mkdir -p "$TASK01512_EVIDENCE"
          {
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "architecture=$(uname -m)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "disk=$(df -h . | tail -1)"
          } | tee "$TASK01512_EVIDENCE/environment.txt"
          test "$(node --version)" = "v20.19.4"
          test "$(npm --version)" = "10.8.2"
      - name: Install exact lockfile dependencies
        timeout-minutes: 20
        run: set -o pipefail; npm ci 2>&1 | tee "$TASK01512_EVIDENCE/npm-ci.log"
      - name: Full math runtime tests
        timeout-minutes: 20
        run: set -o pipefail; npm run test:ts -- --pool=forks --maxWorkers=1 --no-file-parallelism 2>&1 | tee "$TASK01512_EVIDENCE/frontend-ts.log"
      - name: Full frontend regressions including Task 015.12
        timeout-minutes: 40
        run: set -o pipefail; npm run test:web -- --pool=forks --maxWorkers=1 --no-file-parallelism 2>&1 | tee "$TASK01512_EVIDENCE/frontend-web.log"
      - name: Typecheck
        timeout-minutes: 25
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$TASK01512_EVIDENCE/typecheck.log"
      - name: Production build
        timeout-minutes: 35
        run: set -o pipefail; npm run build 2>&1 | tee "$TASK01512_EVIDENCE/build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: task-015-12-frontend-${{ github.run_id }}
          path: .task01512-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  numerical-python:
    name: Python regressions, frozen references and fresh notebook kernels
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.16
          cache: pip
          cache-dependency-path: docs/verification/multilayer-perceptrons/requirements-clean-verification.txt
      - name: Install the approved local numerical profile
        timeout-minutes: 25
        run: |
          mkdir -p "$TASK01512_EVIDENCE"
          echo "commit=$GITHUB_SHA runner=$RUNNER_OS/$RUNNER_ARCH python=$(python --version) architecture=$(uname -m)" | tee "$TASK01512_EVIDENCE/python-environment.txt"
          python -m pip install --disable-pip-version-check -r docs/verification/multilayer-perceptrons/requirements-clean-verification.txt 2>&1 | tee "$TASK01512_EVIDENCE/python-install.log"
          python -m pip check 2>&1 | tee "$TASK01512_EVIDENCE/python-pip-check.log"
          python -c 'import sys,numpy,pandas,matplotlib,sklearn,scipy; assert sys.version_info[:3] == (3,13,16); assert (numpy.__version__,pandas.__version__,matplotlib.__version__,sklearn.__version__,scipy.__version__) == ("2.5.4","3.0.6","3.11.2","1.9.1","1.18.1"); print("APPROVED LOCAL PROFILE VERIFIED")'
      - name: Full Python regressions
        timeout-minutes: 35
        env:
          PYTHONPATH: python
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          IPYTHONDIR: ${{ runner.temp }}/ipython
        run: set -o pipefail; python -m pytest -q 2>&1 | tee "$TASK01512_EVIDENCE/python-tests.log"
      - name: Regenerate and verify 31 frozen MS reference states
        timeout-minutes: 20
        env:
          PYTHONPATH: python
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          LOKY_MAX_CPU_COUNT: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: set -o pipefail; python work/freeze-task-015-12.py --check 2>&1 | tee "$TASK01512_EVIDENCE/frozen-reference-check.log"
      - name: Execute notebook twice in fresh kernels
        timeout-minutes: 25
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          IPYTHONDIR: ${{ runner.temp }}/ipython
        run: set -o pipefail; python work/verify-model-selection-notebook.py 2>&1 | tee "$TASK01512_EVIDENCE/notebook-two-kernels.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: task-015-12-numerical-${{ github.run_id }}
          path: .task01512-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  browser:
    name: Production preview, experiment, keyboard and 320px browser checks
    runs-on: macos-15
    needs: [frontend, numerical-python]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
      - name: Install and build final preview
        timeout-minutes: 40
        run: |
          mkdir -p "$TASK01512_EVIDENCE"
          npm ci
          set -o pipefail
          npm run build 2>&1 | tee "$TASK01512_EVIDENCE/browser-build.log"
      - name: Install pinned Playwright browser
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
      - name: Exercise final production app in Chromium
        timeout-minutes: 25
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3030 > "$TASK01512_EVIDENCE/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3030/supervised/model-selection >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          PLAYWRIGHT_PACKAGE_DIR="$RUNNER_TEMP/playwright/node_modules/playwright" MODEL_SELECTION_PREVIEW_URL="http://127.0.0.1:3030" node work/task-015-12-browser-smoke.cjs 2>&1 | tee "$TASK01512_EVIDENCE/browser-smoke.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: task-015-12-browser-${{ github.run_id }}
          path: .task01512-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
