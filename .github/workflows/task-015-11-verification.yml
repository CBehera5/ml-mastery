name: Task 015.11 Independent Verification

# Manual-only until the founder has established and approved the source repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-015-11-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NEXT_PUBLIC_BETA_FEEDBACK_FORM_URL: ""
  TASK01511_EVIDENCE: ${{ github.workspace }}/.task01511-evidence

jobs:
  frontend:
    name: Frontend tests, typecheck, and production build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          package-manager-cache: false
      - name: Record runner and verify source identity
        run: |
          mkdir -p "$TASK01511_EVIDENCE"
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "disk=$(df -h . | tail -1)"
            echo "git_status=$(git status --porcelain | wc -l | tr -d ' ')"
          } | tee "$TASK01511_EVIDENCE/environment.txt"
          test "$(node --version)" = "v20.19.4"
          test "$(npm --version)" = "10.8.2"
          test "$(uname -m)" = "arm64"
          shasum -a 256 -c docs/verification/multilayer-perceptrons/source-checksums.sha256
      - name: Install exact JavaScript lockfile
        timeout-minutes: 20
        run: bash work/task-015-11-record-step.sh npm-ci npm ci
      - name: Full math-runtime TypeScript tests
        timeout-minutes: 20
        run: bash work/task-015-11-record-step.sh frontend-test-ts npm run test:ts
      - name: Full frontend tests
        timeout-minutes: 30
        run: bash work/task-015-11-record-step.sh frontend-test-web npm run test:web
      - name: Typecheck
        timeout-minutes: 20
        run: bash work/task-015-11-record-step.sh typecheck npm run typecheck
      - name: Production build
        timeout-minutes: 30
        run: bash work/task-015-11-record-step.sh production-build npm run build
      - name: Upload frontend verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-015-11-frontend-${{ github.run_id }}
          path: .task01511-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  numerical-python:
    name: Python regressions, frozen references, gradients, and notebook
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.16
          cache: pip
          cache-dependency-path: docs/verification/multilayer-perceptrons/requirements-clean-verification.txt
      - name: Record runner and install pinned Python profile
        timeout-minutes: 25
        run: |
          mkdir -p "$TASK01511_EVIDENCE"
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "python=$(python --version)"
            echo "pip=$(python -m pip --version)"
            echo "architecture=$(uname -m)"
            echo "disk=$(df -h . | tail -1)"
          } | tee "$TASK01511_EVIDENCE/environment.txt"
          test "$(uname -m)" = "arm64"
          shasum -a 256 -c docs/verification/multilayer-perceptrons/source-checksums.sha256
          bash work/task-015-11-record-step.sh python-install python -m pip install --disable-pip-version-check -r docs/verification/multilayer-perceptrons/requirements-clean-verification.txt
          bash work/task-015-11-record-step.sh python-freeze python -m pip freeze
          bash work/task-015-11-record-step.sh python-dependency-check python -m pip check
          python -c 'import sys,numpy,pandas,matplotlib,sklearn,scipy; assert sys.version_info[:3] == (3,13,16); assert (numpy.__version__,pandas.__version__,matplotlib.__version__,sklearn.__version__,scipy.__version__) == ("2.5.4","3.0.6","3.11.2","1.9.1","1.18.1"); print("APPROVED MLP REFERENCE PROFILE VERIFIED")'
      - name: Full Python regression suite
        timeout-minutes: 30
        env:
          PYTHONPATH: python
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          IPYTHONDIR: ${{ runner.temp }}/ipython
        run: bash work/task-015-11-record-step.sh python-tests python -m pytest
      - name: Frozen manifests, trusted parity, and finite differences
        timeout-minutes: 25
        env:
          PYTHONPATH: python
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: bash work/task-015-11-record-step.sh mlp-frozen-reference python work/check-mlp-freeze-outputs.py
      - name: Two fresh notebook kernels in disposable checkout
        timeout-minutes: 25
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          IPYTHONDIR: ${{ runner.temp }}/ipython
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/task01511-notebook-checkout"
          git worktree add --detach "$scratch" "$GITHUB_SHA"
          before=$(shasum -a 256 "$scratch/apps/web/public/notebooks/supervised-mlp.ipynb" | awk '{print $1}')
          (cd "$scratch" && TASK01511_EVIDENCE="$TASK01511_EVIDENCE" bash work/task-015-11-record-step.sh notebook-two-kernels python work/verify-mlp-notebook.py)
          git -C "$scratch" checkout -- apps/web/public/notebooks/supervised-mlp.ipynb
          after=$(shasum -a 256 "$scratch/apps/web/public/notebooks/supervised-mlp.ipynb" | awk '{print $1}')
          test "$before" = "$after"
          git worktree remove --force "$scratch"
          echo "notebook_source_hash_preserved=$after" | tee -a "$TASK01511_EVIDENCE/environment.txt"
      - name: Upload Python and numerical verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-015-11-python-${{ github.run_id }}
          path: .task01511-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  browser:
    name: Production preview, keyboard, persistence, and 320px browser checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          package-manager-cache: false
      - name: Install and build production preview
        timeout-minutes: 40
        run: |
          mkdir -p "$TASK01511_EVIDENCE"
          test "$(node --version)" = "v20.19.4"
          test "$(npm --version)" = "10.8.2"
          test "$(uname -m)" = "arm64"
          shasum -a 256 -c docs/verification/multilayer-perceptrons/source-checksums.sha256
          bash work/task-015-11-record-step.sh browser-npm-ci npm ci
          bash work/task-015-11-record-step.sh browser-production-build npm run build
      - name: Install pinned isolated browser harness
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install chromium
          node -e 'const p=require(process.env.RUNNER_TEMP+"/playwright/node_modules/playwright/package.json"); if(p.version!=="1.58.2") process.exit(1); console.log("Playwright",p.version)'
      - name: Start built app and exercise MLP in real Chromium
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p "$TASK01511_EVIDENCE"
          node node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3010 > "$TASK01511_EVIDENCE/preview-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3010/supervised/mlp >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          PLAYWRIGHT_PACKAGE_DIR="$RUNNER_TEMP/playwright/node_modules/playwright" \
          MLP_PREVIEW_URL="http://127.0.0.1:3010" \
          bash work/task-015-11-record-step.sh browser-mlp-smoke node work/task-015-11-browser-smoke.cjs
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-015-11-browser-${{ github.run_id }}
          path: .task01511-evidence/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
